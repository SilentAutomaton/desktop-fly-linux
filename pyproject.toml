[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-fly-linux"
version = "0.2.0"
description = "A connectome-driven 3D fruit fly on the Linux desktop (Wayland/X11 fork of DesktopFly)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["desktop-pet", "connectome", "flywire", "wayland", "hyprland", "layer-shell"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Life",
]

# numpy runs the 1 kHz LIF network; PyOpenGL draws both windows.
# PyGObject and gtk-layer-shell are system packages with C libraries behind
# them, so they are not declared here — see README for the distro package list.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
x11 = ["python-xlib>=0.33"]          # X11 / XWayland window list and pointer
dev = ["ruff>=0.6", "mypy>=1.11"]

[project.scripts]
desktop-fly = "desktopfly.cli:main"

[project.urls]
Homepage = "https://github.com/DenisSergeevitch/desktop-fly"
Upstream = "https://github.com/DenisSergeevitch/desktop-fly"

[tool.setuptools]
packages = ["desktopfly", "desktopfly.render", "desktopfly.platform", "desktopfly.selftest"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The two ETL scripts are vendored upstream byte-for-byte. Linting a file
# nobody is allowed to edit only produces noise.
extend-exclude = ["etl.py", "etl_malecns.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "TID"]

# The core modules must stay headless: no GTK, no OpenGL, no platform code.
# This is the lint rule DESIGN.md section 5.3 promises.
[tool.ruff.lint.per-file-ignores]
# TID251 is the banned-api rule below. Only the two layers allowed to touch a
# toolkit are exempt from it.
"desktopfly/platform/*" = ["TID251"]
"desktopfly/render/*" = ["TID251"]
"desktopfly/tray.py" = ["TID251"]
"desktopfly/runtime.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"gi".msg = "core modules must stay headless; GTK belongs in desktopfly/platform"
"OpenGL".msg = "core modules must stay headless; GL belongs in desktopfly/render"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["desktopfly"]

[[tool.mypy.overrides]]
module = ["gi.*", "OpenGL.*", "Xlib.*"]
ignore_missing_imports = true
